<html lang="fa" dir="rtl">
<head>

<title>مسیر ۱۴ هفته‌ای CCNA + Linux</title>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#0a1230;--bg:#eef2fb;--card:#fff;--ink:#0f1a33;--mute:#56637f;--line:#dde3f1;--chip:#f0f3fb;--sh:0 10px 30px -12px #1b2a5a55}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080d1f;--card:#111a35;--ink:#e8edfb;--mute:#9aa8c9;--line:#243259;--chip:#1a2650;--sh:0 10px 30px -12px #000}}
:root[data-theme="dark"]{--bg:#080d1f;--card:#111a35;--ink:#e8edfb;--mute:#9aa8c9;--line:#243259;--chip:#1a2650;--sh:0 10px 30px -12px #000}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.7 "Vazirmatn",Tahoma,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:#0a1230f2;backdrop-filter:blur(8px)}
nav a{flex:none;min-width:34px;text-align:center;color:#fff;border:1px solid #ffffff44;border-radius:99px;padding:0 12px;font-weight:800;font-size:13.5px}
nav a.on{background:#fff;color:#0a1230}
nav a.ok::after{content:" ✓";color:#22c55e}
.hero{background:radial-gradient(800px 320px at 85% -10%,#3b5bdb66,transparent),radial-gradient(600px 300px at 5% 110%,#7c3aed66,transparent),#0a1230;color:#fff;padding:26px 16px 80px}
.hin{max-width:1100px;margin:0 auto;display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tt{flex:1;min-width:260px}
.tt h1{margin:0;font-size:clamp(28px,6vw,54px);font-weight:900;line-height:1.3}
.tt h1 b{background:linear-gradient(90deg,#fde68a,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent}
.tt .sub{font-weight:600;color:#dbe4ff;margin-top:4px}
.tt p{margin:8px 0 0;color:#a9b8e8}
.ring{width:150px;height:150px;border-radius:50%;background:conic-gradient(#fbbf24 calc(var(--p)*1%),#ffffff26 0);display:grid;place-items:center;position:relative;text-align:center}
.ring::before{content:"";position:absolute;inset:12px;border-radius:50%;background:#0a1230}
.ring div{position:relative;line-height:1.3}
.ring b{font-size:28px;font-weight:900;display:block}
.ring small{font-size:11.5px;color:#c9d5ff}
main,.grid{max-width:1100px;margin:0 auto;padding:0 14px}
.home{margin-top:-52px;position:relative}
h2{font-size:19px;font-weight:900;margin:26px 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:12px 15px;font-size:13.5px}
.box b{display:block;font-size:14.5px;font-weight:800}
.box span{color:var(--mute)}
.st i{font-style:normal;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#2563eb;color:#fff;font-weight:800;font-size:12px;margin-left:6px}
.wk{display:block;overflow:hidden;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);transition:transform .2s}
.wk:hover{transform:translateY(-3px)}
.wk .h{background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;padding:10px 14px;font-weight:900;display:flex;justify-content:space-between}
.wk .b{padding:8px 14px 12px;font-size:13px}
.wk .b strong{display:block;font-size:14.5px}
.pb{height:9px;border-radius:9px;background:#ffffff40;overflow:hidden;margin:8px 0 4px}
.wk .pb{background:var(--chip)}
.pb s{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--c,#fbbf24),var(--c2,#fde68a))}
.note{border:2px dashed var(--line);border-radius:16px;padding:10px 14px;font-size:13.5px;margin-top:12px}
.rs{background:#dc2626;color:#fff;border:0;border-radius:99px;padding:3px 16px;font:inherit;font-weight:700;cursor:pointer;margin:16px 0 30px}
.wh{background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;padding:20px 16px 70px}
.wi{max-width:1100px;margin:0 auto}
.wi small{font-weight:700;opacity:.9}
.wi h1{margin:0;font-size:clamp(26px,5vw,42px);font-weight:900}
.wi span{font-size:13px;font-weight:700}
.goal{margin-top:10px;background:#ffffff26;border:1px solid #ffffff55;border-radius:14px;padding:8px 14px;font-weight:600;font-size:14px}
.grid{margin-top:-52px;position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.day{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);overflow:hidden}
.dh{background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.dh h3{margin:0;font-size:18px;font-weight:900;line-height:1.3}
.dh small{font-weight:600;font-size:12.5px}
.tm{background:#ffffff2e;border:1px solid #ffffff55;border-radius:12px;padding:1px 10px;font-size:12.5px;font-weight:800;white-space:nowrap}
.tk{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-top:1px dashed var(--line);font-size:13.5px;cursor:pointer}
.tk:first-of-type{border-top:0}
.tk input{flex:none;width:22px;height:22px;margin:2px 0 0;accent-color:var(--c);cursor:pointer}
.tk span{flex:1}
.tk em{flex:none;font-style:normal;font-size:11.5px;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--card));border-radius:99px;padding:0 9px;white-space:nowrap}
.tk input:checked+span{opacity:.5;text-decoration:line-through}
.day.done{outline:2px solid var(--c)}
.pn{max-width:1100px;margin:22px auto 34px;padding:0 14px;display:flex;justify-content:space-between;gap:10px}
.pn a{background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;font-weight:800;border-radius:99px;padding:4px 18px}
:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
.syn p{margin:0 0 8px}.syn input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--chip);color:var(--ink);font:inherit;direction:ltr}.bt{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.bt button,.fl{background:linear-gradient(135deg,#2563eb,#38bdf8);color:#fff;border:0;border-radius:99px;padding:3px 16px;font:inherit;font-weight:700;font-size:13px;cursor:pointer}.ss{color:var(--mute);font-size:12.5px}nav .ss{color:#c9d5ff;white-space:nowrap;align-self:center;margin-inline-start:auto;padding-inline:6px}
</style>
</head>

const stash=()=>{try{localStorage.setItem("c14gid",GID)}catch(e){}};
async function push(){if(!TOK)return;setST("در حال ذخیره…");
 try{const body={files:{[FN]:{content:JSON.stringify({t:TS,k:[...S]})}}};
  if(GID)await api("/gists/"+GID,{method:"PATCH",body:JSON.stringify(body)});
  else{const g=await api("/gists",{method:"POST",body:JSON.stringify({description:"CCNA roadmap progress",public:false,...body})});GID=g.id;stash()}
  setST("ذخیره شد ✓ "+new Date().toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"}))}catch(e){setST("خطا در ذخیره ("+e.message+")")}}
async function pull(){if(!TOK)return;setST("در حال همگام‌سازی…");
 try{if(!GID){const l=await api("/gists?per_page=100"),g=l.find(x=>x.files&&x.files[FN]);if(g){GID=g.id;stash()}}
  if(GID){const g=await api("/gists/"+GID),d=JSON.parse(g.files[FN].content);
   if(d.t>TS){S=new Set(d.k);TS=d.t;save(1);render();setST("همگام شد ✓");return}}
  await push()}catch(e){setST("خطا در همگام‌سازی ("+e.message+")")}}
let tm;const later=()=>{if(!TOK)return;clearTimeout(tm);tm=setTimeout(push,900)};
const key=(w,j,k)=>w+"-"+j+"-"+k;
function T(w,j){const x=W[w].d[j],A=["Anki، یادداشت و ثبت واژگان",15];
 if(j<5)return[[x[1],75],[x[2],30],A];
 if(j==5)return[["آماده‌سازی: مرور Anki و طراحی Lab روی کاغذ",30],[x[1],120],["مستندسازی: README، اسکرین‌شات و commit در GitHub",30]];
 return[[x[1],40],["بافر: جبران عقب‌افتادگی یا مرور Anki",20]]}
function ws(w){let a=0,b=0;for(let j=0;j<7;j++)T(w,j).forEach((t,k)=>{b+=t[1];if(S.has(key(w,j,k)))a+=t[1]});return[a,b]}
const pc=(a,b)=>Math.round(a/b*100);
function nav(c){return'<nav><a href="#/" class="'+(c==0?"on":"")+'">خانه</a>'+W.map((_,i)=>{const[a,b]=ws(i);return'<a href="#/'+(i+1)+'" class="'+(c==i+1?"on ":"")+(a==b?"ok":"")+'">'+fa(i+1)+'</a>'}).join("")+'<span class="ss">'+ST+'</span></nav>'}
function home(){let A=0,B=0;W.forEach((_,i)=>{const[a,b]=ws(i);A+=a;B+=b});const p=pc(A,B);
const st=[["یادگیری","ویدئو با سرعت 1x؛ برای هر کلمه‌ی ناشناخته pause نکن."],["Lab همان روز","هر مفهوم را همان روز در Packet Tracer یا ترمینال اجرا کن."],["کتاب","بعد از Lab، فقط بخش مربوط را بخوان (Acing the CCNA)."],["بازیابی فعال","Anki و توضیح شفاهی بدون جزوه؛ مرور فاصله‌دار."]];
const rs=[["<a href='https://www.youtube.com/playlist?list=PLxbwE86jKRgMpuZuLBivzlM8s2Dk5lXBQ' target='_blank' rel='noopener'>Jeremy's IT Lab: CCNA 200-301 Complete Course ↗</a>","پلی‌لیست رایگان یوتیوب: Day 1 تا 63 و Mega Lab؛ منبع اصلی ویدئویی."],["Acing the CCNA Exam ج۱ و ج۲ (Jeremy McDowell، Manning)","کتاب همراه؛ فصل‌ها تقریباً یک‌به‌یک با Dayها. همیشه بعد از Lab."],["<a href='https://linuxcommand.org' target='_blank' rel='noopener'>The Linux Command Line (Shotts) ↗</a>","رایگان؛ شماره‌ی فصل‌ها را با نسخه‌ی خودت تطبیق بده."],["<a href='https://overthewire.org/wargames/bandit/' target='_blank' rel='noopener'>OverTheWire Bandit ↗</a>","Level 0 تا 33 به‌صورت هفتگی."],["<a href='https://www.wireshark.org/docs/' target='_blank' rel='noopener'>Wireshark Docs ↗</a> و Chris Greer","تحلیل ترافیک."],["<a href='https://nmap.org/book/' target='_blank' rel='noopener'>Nmap Network Scanning ↗</a>","فقط روی شبکه‌ی خودت."]];
return'<section class="hero"><div class="hin"><div class="tt"><h1>مسیر ۱۴ هفته‌ای <b>CCNA + Linux</b></h1><div class="sub">Networking · Linux · Security-Oriented Foundations</div><p>هر هفته حدود ۱۴ ساعت (روزی ۲ ساعت)، با Lab و مرور فعال. روی هر هفته بزن و تسک‌ها را تیک بزن.</p></div><div class="ring" style="--p:'+p+'"><div><b>'+fa(p)+'٪</b><small>'+fa((A/60).toFixed(1))+' از '+fa(Math.round(B/60))+' ساعت</small></div></div></div></section><main class="home"><div class="cards">'+st.map((s,i)=>'<div class="box st"><b><i>'+fa(i+1)+'</i>'+s[0]+'</b><span>'+s[1]+'</span></div>').join("")+'</div><h2>هفته‌ها</h2><div class="cards">'+W.map((x,i)=>{const[a,b]=ws(i),q=pc(a,b);return'<a class="wk" href="#/'+(i+1)+'" style="--c:'+CL[i][0]+';--c2:'+CL[i][1]+'"><div class="h"><span>هفته '+fa(i+1)+'</span><span>'+fa(q)+'٪</span></div><div class="b"><strong>'+x.n+'</strong><bdi>'+x.e+'</bdi><div class="pb"><s style="width:'+q+'%"></s></div></div></a>'}).join("")+'</div><h2>منابع</h2><div class="cards">'+rs.map(r=>'<div class="box"><b>'+r[0]+'</b><span>'+r[1]+'</span></div>').join("")+'</div><h2>قانون‌ها</h2><div class="cards"><div class="box"><b>انگلیسی</b><span>کلمه را یک‌بار دیدی، رد شو. چندبار دیدی و نفهمیدی، ترجمه کن. تخصصی بود، در واژه‌نامه ثبت کن.</span></div><div class="box"><b>مفهوم سخت شد؟</b><span>همان‌جا بمان (تا یک هفته اضافه). برنامه برای تو ساخته شده، نه تو برای برنامه.</span></div><div class="box"><b>موضوع جذاب دیگر؟</b><span>فقط اسمش را در later.md بنویس و برگرد.</span></div><div class="box"><b>Dayهای موکول‌شده</b><span>Day 25 (RIP و EIGRP) و بخش‌های اضافه‌ی v1.1 (Root/Loop Guard، AI & ML، Containers، VRF) فعلاً حذف‌اند؛ آخر مسیر اگر وقت بود.</span></div><div class="box"><b>آزمون CCNA (اختیاری)</b><span>CCNA v2.0 از ۳ فوریه ۲۰۲۷ فعال می‌شود. برای آزمون، هفته‌ی آزمون‌های تمرینی جدا اضافه کن.</span></div></div><h2>همگام‌سازی و پشتیبان</h2><div class="box syn"><p>'+(TOK?"به GitHub Gist متصل است؛ تیک‌ها خودکار روی همه‌ی دستگاه‌ها همگام می‌شوند.":"برای همگام‌سازی روی همه‌ی دستگاه‌ها، GitHub Token را یک‌بار وارد کن (Token فقط در همین مرورگر می‌ماند).")+'</p>'+(TOK?'':'<input id="tk" type="password" placeholder="ghp_..." autocomplete="off">')+'<div class="bt">'+(TOK?'<button id="sn">همگام‌سازی حالا</button><button id="dc">قطع اتصال</button>':'<button id="cn">اتصال و همگام‌سازی</button>')+'</div><div class="bt"><button id="ex">خروجی فایل پشتیبان</button><label class="fl">بازگردانی از فایل<input id="im" type="file" accept=".json" hidden></label></div><small class="ss">'+ST+'</small></div><button class="rs" id="rs">پاک‌کردن پیشرفت</button></main>'}
function week(i){const x=W[i],[a,b]=ws(i),p=pc(a,b);
return'<div style="--c:'+CL[i][0]+';--c2:'+CL[i][1]+'"><section class="wh"><div class="wi"><small>هفته '+fa(i+1)+' از '+fa(W.length)+'</small><h1>'+x.n+'</h1><bdi>'+x.e+'</bdi><div class="pb"><s style="width:'+p+'%"></s></div><span>'+fa(p)+'٪ · '+fa((a/60).toFixed(1))+' از ۱۴ ساعت</span><div class="goal">هدف هفته: '+x.g+'</div></div></section><div class="grid">'+DN.map((d,j)=>{const t=T(i,j),all=t.every((_,k)=>S.has(key(i,j,k))),m=t.reduce((s,q)=>s+q[1],0);
return'<article class="day'+(all?" done":"")+'"><div class="dh"><div><h3>'+d+'</h3><small>'+x.d[j][0]+'</small></div><div class="tm">'+(all?"✓ ":"")+fa(m/60)+' ساعت</div></div>'+t.map((q,k)=>'<label class="tk"><input type="checkbox" data-k="'+key(i,j,k)+'"'+(S.has(key(i,j,k))?" checked":"")+'><span>'+q[0]+'</span><em>'+fa(q[1])+' د</em></label>').join("")+'</article>'}).join("")+'</div><div class="pn">'+(i?'<a href="#/'+i+'">هفته '+fa(i)+'</a>':'<span></span>')+(i<W.length-1?'<a href="#/'+(i+2)+'">هفته '+fa(i+2)+'</a>':'<a href="#/">بازگشت به خانه</a>')+'</div></div>'}
function render(){const m=location.hash.match(/#\/(\d+)/),n=m?+m[1]:0;app.innerHTML=nav(n)+(n>=1&&n<=W.length?week(n-1):home())}
addEventListener("hashchange",()=>{render();scrollTo(0,0)});
app.addEventListener("change",e=>{const t=e.target,k=t.dataset&&t.dataset.k;if(!k)return;t.checked?S.add(k):S.delete(k);save();later();render();const n=app.querySelector('[data-k="'+k+'"]');if(n)n.focus()});
let armed=false;
app.addEventListener("click",e=>{if(e.target.id!=="rs")return;if(!armed){armed=true;e.target.textContent="مطمئنی؟ دوباره بزن";return}S=new Set();save();later();armed=false;render()});
app.addEventListener("click",async e=>{const id=e.target.id;
 if(id==="cn"){const v=document.getElementById("tk").value.trim();if(!v)return;TOK=v;try{localStorage.setItem("c14tok",v)}catch(x){}await pull();render()}
 if(id==="sn"){await pull()}
 if(id==="dc"){TOK="";GID="";try{localStorage.removeItem("c14tok");localStorage.removeItem("c14gid")}catch(x){}setST("");render()}
 if(id==="ex"){const b=new Blob([JSON.stringify({t:TS,k:[...S]})],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="c14-progress.json";a.click()}});
app.addEventListener("change",e=>{if(e.target.id!=="im")return;const f=e.target.files[0];if(!f)return;f.text().then(t=>{const d=JSON.parse(t);S=new Set(d.k);save();later();render();setST("بازگردانی شد ✓")}).catch(()=>setST("فایل نامعتبر است"))});
render();pull();
</script>
</body>
</html>
